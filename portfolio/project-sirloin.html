<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sirloin — Portfolio 2026</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/project.css">
    <script src="./scripts/index.js" defer></script>
    <script src="./scripts/project.js" defer></script>
</head>
<body>
        <!-- 전역 커스텀 커서 -->
    <div class="cursor" id="cursor">
        <span class="cursor__label"></span>
    </div>
    <!-- 공통 고정 네비게이션 -->
    <header class="nav">
        <a href="index.html#slide-0" class="nav__logo">Portfolio<sup>2026</sup></a>
        <a href="index.html#slide-0" class="nav__mark" aria-label="홈으로 이동"><!-- 로고svg --></a>
        <nav class="nav__links">
            <a href="index.html#slide-1">About</a>
            <a href="index.html#slide-2">Work</a>
            <a href="index.html#slide-3">Graphic</a>
        </nav>
    </header>
    <main class="project">
        <div class="project__body">
            <a href="index.html#slide-2" class="project__back" aria-label="Works로 돌아가기"><img src="#" alt="화살표"></a>
            <!-- 1. 좌측 열 (타이틀, 링크, 메타) 고정 -->
            <div class="project__info">
                <p class="project__label">Project</p>
                <div class="project__title-row">
                    <h1 class="project__title">Sirloin</h1>
                    <span class="project__num">(01)</span>
                </div>
                <div class="project__links">
                    <a href="#" target="_blank" rel="noopener noreferrer"><!-- 새창,보안/접근성 -->
                        Git
                        <img src="#" alt="화살표">
                    </a>
                    <a href="#" target="_blank" rel="noopener noreferrer">
                        Original
                        <img src="#" alt="화살표">
                    </a>
                </div>
                <dl class="project__meta">
                    <div>
                        <dt>Project Type</dt>
                        <dd>App-to-Web Redesign</dd>
                    </div>
                    <div>
                        <dt>Tools</dt>
                        <dd>HTML, Javascript, CSS, Photoshop, Illustrator</dd>
                    </div>
                    <div>
                        <dt>Role</dt>
                        <dd>UI/UX Design, Web Publishing, Web Redesign</dd>
                    </div>
                </dl>

                <span class="project__vertical-label">Web Design</span>
            </div>

            <!-- 2. 우측 열 (설명 + 히어로 이미지 배너 + 핀 고정 맥북 목업) 스크롤 -->
            <div class="project__main">
                <!-- 2-1) 설명 영역 -->
                <div class="project__description">
                    <p class="project__desc-label">Description</p>
                    <p class="project__desc-text"><!-- 설명 카피 자리 --></p>
                    <p class="project__year-label">Year</p>
                    <p class="project__year-value">2026.08</p>
                </div>
                <!-- 2-2) 히어로 이미지 + 스크롤 진행률 인디케이터 -->
                <div class="project__hero">
                    <div class="project__hero-image"></div>
                    <div class="project__scroll-indicator">
                        <span class="project__scroll-percent">0%</span>
                    </div>
                    <p class="project__scroll-label">Scroll</p>
                </div>
                <!-- 2-3) 핀 고정 맥북 목업 -->
                <div class="project__mockup-section">
                    <div class="project__laptop-mockup">
                        <div class="project__laptop-screen"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
